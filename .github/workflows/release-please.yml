name: Prepare Release PR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare calculated version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create or update release PR only
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          # GitHub suppresses workflow events emitted by GITHUB_TOKEN.
          # A maintainer must explicitly run CI for its PR before merging,
          # or configure a separately authorized GitHub App token.
